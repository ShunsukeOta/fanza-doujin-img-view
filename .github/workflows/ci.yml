name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.pull_request.title, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: swipe_preview_test
          MARIADB_USER: swipe
          MARIADB_PASSWORD: swipe_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Node.jsを準備
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: PHPを準備
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql, mbstring
          coverage: none

      - name: lockfileから依存関係を再現
        run: |
          set -euo pipefail
          test -f package-lock.json
          npm ci --no-audit --no-fund

      - name: TypeScript・PHP・負債・Readerロジックを検証
        run: |
          set -euo pipefail
          npm run typecheck
          npm run check:php
          npm run check:debt
          npm run test:logic
          php -r '
            require "server/app/src/PriceParser.php";
            $cases = ["1,000円" => 1000, "500〜1,000円" => null, "無料" => null];
            foreach ($cases as $raw => $expected) {
              if (SwipePreview\PriceParser::singleValue($raw) !== $expected) exit(1);
            }
          '
          php -r '
            require "server/app/src/FanzaClient.php";
            $client = new SwipePreview\FanzaClient(["api_id" => "", "affiliate_id" => ""]);
            $item = $client->feedItem([
              "content_id" => "test001",
              "title" => "test",
              "imageURL" => ["large" => "https://pics.dmm.co.jp/digital/comic/test/testpl.jpg"],
              "iteminfo" => ["maker" => [["id" => "maker-001", "name" => "Test Circle"]]],
            ]);
            if (($item["makerId"] ?? "") !== "maker-001" || ($item["maker"] ?? "") !== "Test Circle") exit(1);
            if ($client->isComicItem(["imageURL" => ["large" => "https://pics.dmm.co.jp/digital/cg/test/testpl.jpg"]])) exit(1);
          '

      - name: MariaDB設定を作成
        run: |
          set -euo pipefail
          cat > server/app/config.local.php <<'PHP'
          <?php
          return [
            'dmm' => ['api_id' => '', 'affiliate_id' => ''],
            'db' => [
              'host' => '127.0.0.1',
              'port' => 3306,
              'name' => 'swipe_preview_test',
              'user' => 'swipe',
              'password' => 'swipe_test_password',
              'charset' => 'utf8mb4',
            ],
            'app' => [
              'timezone' => 'Asia/Tokyo',
              'public_origin' => 'https://example.invalid',
              'event_retention_days' => 60,
              'profile_retention_days' => 180,
              'sync_pages' => 5,
              'admin_token' => '',
            ],
          ];
          PHP

      - name: DB移行を冪等実行してコミック専用schemaを確認
        run: |
          set -euo pipefail
          php server/app/cron/setup-db.php
          php server/app/cron/setup-db.php
          php <<'PHP'
          <?php
          $config = require 'server/app/config.local.php';
          $dsn = sprintf(
              'mysql:host=%s;port=%d;dbname=%s;charset=%s',
              $config['db']['host'],
              $config['db']['port'],
              $config['db']['name'],
              $config['db']['charset'],
          );
          $pdo = new PDO($dsn, $config['db']['user'], $config['db']['password'], [
              PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
              PDO::ATTR_EMULATE_PREPARES => false,
          ]);
          foreach (['works', 'feed_sessions', 'feed_items', 'events', 'app_migrations', 'sync_runs'] as $table) {
              $stmt = $pdo->prepare(
                  'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = ?'
              );
              $stmt->execute([$table]);
              if ((int)$stmt->fetchColumn() !== 1) throw new RuntimeException("missing table: {$table}");
          }
          foreach (['floor_key', 'sample_movie_url', 'asset_type', 'asset_bucket'] as $column) {
              $stmt = $pdo->prepare(
                  'SELECT COUNT(*) FROM information_schema.columns '
                  . 'WHERE table_schema = DATABASE() AND table_name = ? AND column_name = ?'
              );
              $stmt->execute(['works', $column]);
              if ((int)$stmt->fetchColumn() !== 0) throw new RuntimeException("obsolete column remains: {$column}");
          }
          $index = $pdo->query(
              "SELECT COUNT(*) FROM information_schema.statistics "
              . "WHERE table_schema=DATABASE() AND table_name='works' AND index_name='idx_works_feed'"
          );
          if ((int)$index->fetchColumn() === 0) throw new RuntimeException('idx_works_feed missing');
          if ((int)$pdo->query("SELECT COUNT(*) FROM app_migrations WHERE id='multi-floor-amateur-video-20260908'")->fetchColumn() !== 0) {
              throw new RuntimeException('obsolete multi-floor migration remains');
          }
          if (!(bool)$pdo->query("SELECT 1 FROM app_migrations WHERE id='recommendation-v3-rebuild-20260907'")->fetchColumn()) {
              throw new RuntimeException('recommendation migration missing');
          }
          PHP

      - name: 固定Feed・検索・保存・履歴を統合検証
        run: |
          set -euo pipefail
          php server/app/tests/integration.php
          php server/app/tests/search-integration.php
          rm -f server/app/config.local.php

      - name: クリティカルな回帰を検証
        run: |
          set -euo pipefail
          test ! -e .github/workflows/backfill-2025-09-05.yml
          test ! -e .github/workflows/verify-production.yml
          test ! -e components/VideoWorkCard.tsx
          test ! -e components/FloorSwitcher.tsx
          test -f components/FloorTabs.tsx
          test ! -e components/ComingSoonFloorPage.tsx
          test -f src/floors.ts
          test ! -e styles/video.css
          grep -F '同人漫画' src/floors.ts >/dev/null
          grep -F '女優動画' src/floors.ts >/dev/null
          grep -F '素人動画' src/floors.ts >/dev/null
          grep -F 'available: false' src/floors.ts >/dev/null
          grep -F 'floorContextPath' components/FloorTabs.tsx >/dev/null
          grep -F 'feed_sessions' server/app/schema.sql >/dev/null
          grep -F 'feed_items' server/app/schema.sql >/dev/null
          grep -F 'idx_works_feed' server/app/schema.sql >/dev/null
          grep -F 'sampleReadRatio' components/WorkCard.tsx >/dev/null
          grep -F 'reader-cta-link' components/WorkCard.tsx >/dev/null
          grep -F 'recordBatch' server/app/src/EventService.php >/dev/null
          grep -F 'SearchService' server/app/bootstrap.php >/dev/null
          grep -F 'maker_query' server/app/src/SearchService.php >/dev/null
          grep -F 'series_query' server/app/src/SearchService.php >/dev/null
          grep -F 'work.php?cid=' server/public/.htaccess >/dev/null
          grep -F 'og:title' server/public/work.php >/dev/null
          grep -F 'refresh-catalog.php' .github/workflows/sync-shin.yml >/dev/null
          grep -F 'retention.php' .github/workflows/sync-shin.yml >/dev/null
          grep -F 'admin_request_authorized' server/public/api/debug.php >/dev/null
          grep -F 'admin_request_authorized' server/public/api/diagnostics.php >/dev/null
          grep -F 'Content-Security-Policy' server/public/.htaccess >/dev/null
          grep -F 'cancel-in-progress: false' .github/workflows/deploy-shin.yml >/dev/null
          grep -F 'isComicItem' server/app/src/FanzaClient.php >/dev/null
          grep -F 'isComicItem' server/app/cron/fanza-sync.php >/dev/null
          if grep -R -E 'floor_key|sample_movie_url|VideoWorkCard|videoc' --exclude='ComicOnlyCleanup.php' --exclude='comic-only-cleanup-integration.php' server src components styles lib; then
            echo '廃止済み動画フロア実装が残っています。' >&2
            exit 1
          fi
          if grep -F 'Math.round(track.scrollLeft / track.clientWidth)' -n src components; then
            echo '旧RTLページ計測が残っています。' >&2
            exit 1
          fi
          if grep -F 'candidateTarget = min(1500' -n server/app/src/CatalogService.php; then
            echo '1,500件固定候補上限が残っています。' >&2
            exit 1
          fi
          if grep -F 'CRC32(CONCAT' -n server/app/src/CatalogService.php; then
            echo '全件式CRC32 ORDER BYが残っています。' >&2
            exit 1
          fi

      - name: 本番成果物を作成
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build:shin

      - name: 成果物と秘密情報混入を確認
        run: |
          set -euo pipefail
          test -f deploy/public_html/index.html
          test -f deploy/public_html/manifest.webmanifest
          test -f deploy/public_html/sw.js
          test -f deploy/public_html/.htaccess
          test -f deploy/public_html/work.php
          test -f deploy/public_html/api/catalog.php
          test -f deploy/public_html/api/search.php
          test -f deploy/public_html/api/events.php
          test -f deploy/app/cron/setup-db.php
          test -f deploy/app/cron/fanza-sync.php
          test -f deploy/app/cron/refresh-catalog.php
          test -f deploy/app/cron/retention.php
          test -f deploy/app/src/WorkRepository.php
          test -f deploy/app/src/SearchService.php
          test -f deploy/app/src/PriceParser.php
          test ! -e deploy/app/tests
          test ! -f deploy/app/config.local.php
          grep -F 'Content-Security-Policy' deploy/public_html/.htaccess >/dev/null
