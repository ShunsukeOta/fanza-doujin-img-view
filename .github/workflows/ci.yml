name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 静的検証
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Node.jsを準備
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: PHPを準備
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql, mbstring
          coverage: none

      - name: lockfileから依存関係を再現
        run: npm ci --no-audit --no-fund

      - name: TypeScriptを検証
        run: npm run typecheck

      - name: PHP構文を検証
        run: npm run check:php

      - name: アーキテクチャ負債を検証
        run: npm run check:debt

      - name: Readerロジックを検証
        run: npm run test:logic

  integration:
    name: DB・公開API・本番成果物
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: swipe_preview_test
          MARIADB_USER: swipe
          MARIADB_PASSWORD: swipe_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Node.jsを準備
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: PHPを準備
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql, mbstring
          coverage: none

      - name: lockfileから依存関係を再現
        run: npm ci --no-audit --no-fund

      - name: MariaDBテスト設定を作成
        run: |
          cat > server/app/config.local.php <<'PHP'
          <?php
          return [
            'dmm' => ['api_id' => '', 'affiliate_id' => ''],
            'db' => [
              'host' => '127.0.0.1',
              'port' => 3306,
              'name' => 'swipe_preview_test',
              'user' => 'swipe',
              'password' => 'swipe_test_password',
              'charset' => 'utf8mb4',
            ],
            'app' => [
              'timezone' => 'Asia/Tokyo',
              'public_origin' => 'http://127.0.0.1:8787',
              'event_retention_days' => 60,
              'profile_retention_days' => 180,
              'sync_pages' => 5,
              'admin_token' => '',
            ],
          ];
          PHP

      - name: DB migrationを冪等実行
        run: |
          set -euo pipefail
          php server/app/cron/setup-db.php
          php server/app/cron/setup-db.php

      - name: schema不変条件を実DBで確認
        run: |
          php <<'PHP'
          <?php
          $config = require 'server/app/config.local.php';
          $dsn = sprintf('mysql:host=%s;port=%d;dbname=%s;charset=%s', $config['db']['host'], $config['db']['port'], $config['db']['name'], $config['db']['charset']);
          $pdo = new PDO($dsn, $config['db']['user'], $config['db']['password'], [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          foreach (['works','feed_sessions','feed_items','events','user_work_states','sync_runs'] as $table) {
              $stmt = $pdo->prepare('SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name=?');
              $stmt->execute([$table]);
              if ((int)$stmt->fetchColumn() !== 1) throw new RuntimeException("missing table: {$table}");
          }
          foreach (['liked','liked_at','floor_key','sample_movie_url','asset_type','asset_bucket'] as $column) {
              $stmt = $pdo->prepare('SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND column_name=?');
              $stmt->execute([$column]);
              if ((int)$stmt->fetchColumn() !== 0) throw new RuntimeException("obsolete column remains: {$column}");
          }
          PHP

      - name: 定期巡回SQLを実行検証
        run: php server/app/cron/refresh-catalog.php --plan-only --limit=20

      - name: Domain統合テスト
        run: |
          set -euo pipefail
          php server/app/tests/integration.php
          php server/app/tests/search-integration.php
          php server/app/tests/adaptive-recommendation-integration.php

      - name: 公開APIを実HTTPでcontract検証
        run: bash scripts/test-http-contract.sh

      - name: 本番成果物を作成
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build:shin

      - name: 本番成果物の公開境界を確認
        run: |
          set -euo pipefail
          test -f deploy/public_html/index.html
          test -f deploy/public_html/manifest.webmanifest
          test -f deploy/public_html/sw.js
          test -f deploy/public_html/.htaccess
          test -f deploy/public_html/work.php
          for api in catalog search events save-state saved history me work-details; do
            test -f "deploy/public_html/api/${api}.php"
          done
          for file in FeedRepository CandidateSource RecommendationRanker CatalogService WorkRepository SearchService; do
            test -f "deploy/app/src/${file}.php"
          done
          test -f deploy/app/cron/refresh-catalog.php
          test ! -e deploy/app/tests
          test ! -f deploy/app/config.local.php
          if grep -R -E 'reactionSummaries|viewerLiked|likeCount|saveCount|s\.liked' deploy/app deploy/public_html/api; then
            echo '廃止済みLike/Reaction依存が本番成果物へ混入しています。' >&2
            exit 1
          fi

      - name: テスト用設定を削除
        if: always()
        run: rm -f server/app/config.local.php
