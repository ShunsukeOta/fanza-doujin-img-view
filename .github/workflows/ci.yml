name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql
          coverage: none
      - name: 依存関係をインストール
        run: npm install --no-audit --no-fund
      - name: TypeScript型チェック
        run: npm run typecheck
      - name: PHP構文チェック
        run: npm run check:php
      - name: 旧コードと不要ファイルの残留を確認
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app
          test ! -e next.config.ts
          test ! -e next-env.d.ts
          test ! -e .vercel
          test ! -e vercel.json
          test ! -e styles/feed-stats.css
          test ! -e components/FavoritesPage.tsx
          test ! -e server/public/api/favorites.php
          test ! -e server/public/api/recommend.php
          if grep -R -n -E '(^|[^A-Za-z])(server-only|NextRequest|NextResponse|"use client"|\x27use client\x27)' components src lib server --include='*.ts' --include='*.tsx' --include='*.php'; then
            echo "旧Next.js由来のコードが残っています。" >&2
            exit 1
          fi
      - name: 漫画ビューアーの必須実装を確認
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'className="preview-track manga-reader-track"' components/WorkCard.tsx >/dev/null
          grep -F '本編残り' components/WorkCard.tsx >/dev/null
          grep -F '続きを読む' components/WorkCard.tsx >/dev/null
          grep -F 'reader-focus' components/FocusModeToggle.tsx >/dev/null
          grep -F '保存済み' components/GlobalNav.tsx >/dev/null
      - name: PWAと画面復帰を確認
        shell: bash
        run: |
          set -euo pipefail
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/icons/app-icon.svg
          test -f src/pwaViewport.ts
          grep -F 'apple-mobile-web-app-capable' index.html >/dev/null
          grep -F 'rel="manifest"' index.html >/dev/null
          python3 - <<'PY'
          import json
          with open('public/manifest.webmanifest', encoding='utf-8') as f:
              manifest = json.load(f)
          assert manifest['display'] == 'standalone'
          assert manifest['start_url'] == '/'
          assert manifest['scope'] == '/'
          PY
          grep -F 'installPwaViewportFix();' src/main.tsx >/dev/null
          grep -F 'window.visualViewport' src/pwaViewport.ts >/dev/null
          grep -F 'window.screen.height' src/pwaViewport.ts >/dev/null
          grep -F -- '--pwa-bottom-extension' src/pwaViewport.ts >/dev/null
          grep -F 'rememberMainBeforeSubpage' components/GlobalNav.tsx >/dev/null
          grep -F 'resumeMainFromSubpage' components/GlobalNav.tsx >/dev/null
          grep -F 'history.go(-state.historySteps)' src/navigationState.ts >/dev/null
          grep -F 'prepareMainResumeFallback' src/main.tsx >/dev/null
      - name: PWA余白の回帰を確認
        shell: bash
        run: |
          set -euo pipefail
          test -f styles/pwa-layout.css
          grep -F -- '--pwa-bottom-extension: 0px' styles/navigation.css >/dev/null
          grep -F 'bottom: calc(-1 * var(--pwa-bottom-extension))' styles/navigation.css >/dev/null
          grep -F 'height: calc(var(--global-nav-h) + var(--nav-safe-bottom) + var(--pwa-bottom-extension))' styles/navigation.css >/dev/null
          grep -F 'padding: 3px 16px var(--nav-safe-bottom)' styles/navigation.css >/dev/null
          grep -F 'html[data-pwa-standalone="true"]' styles/navigation.css >/dev/null
          grep -F 'padding-bottom: calc(var(--global-nav-h) + var(--nav-safe-bottom) + 6px)' styles/pwa-layout.css >/dev/null
      - name: 集中モードの残骸を確認
        shell: bash
        run: |
          set -euo pipefail
          grep -F '.reader-focus .item-info' styles/reader.css >/dev/null
          grep -F 'visibility: hidden' styles/reader.css >/dev/null
          grep -F 'pointer-events: none !important' styles/reader.css >/dev/null
      - name: サブページ見出しと件数UIを確認
        shell: bash
        run: |
          set -euo pipefail
          if grep -F 'LIBRARY' components/SavedPage.tsx >/dev/null; then
            echo "保存済みに英語サブ見出しが残っています。" >&2
            exit 1
          fi
          if grep -F 'MY PAGE' components/MyPage.tsx >/dev/null; then
            echo "マイページに英語サブ見出しが残っています。" >&2
            exit 1
          fi
          if grep -F 'あとで読みたい作品をまとめて確認できます' components/SavedPage.tsx >/dev/null; then
            echo "保存済みに説明文が残っています。" >&2
            exit 1
          fi
          if grep -F '保存した作品や、これまでの閲覧からあなた向けの情報をまとめます' components/MyPage.tsx >/dev/null; then
            echo "マイページに説明文が残っています。" >&2
            exit 1
          fi
          grep -F '<span>保存した作品 <strong>{total.toLocaleString("ja-JP")}</strong>件</span>' components/SavedPage.tsx >/dev/null
          grep -F 'font-size: 12px' styles/pwa-layout.css >/dev/null
          grep -F 'justify-content: flex-end' styles/pwa-layout.css >/dev/null
          grep -F 'border: 0' styles/pwa-layout.css >/dev/null
          grep -F 'padding: 0' styles/pwa-layout.css >/dev/null
      - name: 価格範囲フィルターを確認
        shell: bash
        run: |
          set -euo pipefail
          grep -F '価格下限' components/SwipePreviewApp.tsx >/dev/null
          grep -F '価格上限' components/SwipePreviewApp.tsx >/dev/null
          grep -F 'min_price' components/SwipePreviewApp.tsx >/dev/null
          grep -F 'max_price' components/SwipePreviewApp.tsx >/dev/null
          grep -F "'minPrice' => read_int('min_price'" server/app/bootstrap.php >/dev/null
          grep -F "'maxPrice' => read_int('max_price'" server/app/bootstrap.php >/dev/null
          grep -F 'w.price_value >= :min_price' server/app/src/CatalogService.php >/dev/null
          grep -F 'w.price_value <= :max_price' server/app/src/CatalogService.php >/dev/null
          grep -F 'price_value INT UNSIGNED NULL' server/app/schema.sql >/dev/null
          grep -F "ensure_column(\$pdo, 'works', 'price_value'" server/app/cron/setup-db.php >/dev/null
          grep -F 'price_value=VALUES(price_value)' server/app/cron/fanza-sync.php >/dev/null
      - name: 保存済みUIを確認
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'favorite-save-toggle' components/SavedPage.tsx >/dev/null
          grep -F 'サンプルを見る' components/SavedPage.tsx >/dev/null
          grep -F 'openWorkInMain(item.cid)' components/SavedPage.tsx >/dev/null
          if grep -F 'favorite-reactions' components/SavedPage.tsx >/dev/null; then
            echo "保存済みカードにリアクション件数表示が残っています。" >&2
            exit 1
          fi
          if grep -F '>FANZA' components/SavedPage.tsx >/dev/null; then
            echo "保存済みカードに旧FANZAボタンが残っています。" >&2
            exit 1
          fi
      - name: 本番成果物を作成
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build:shin
      - name: 成果物を確認
        run: |
          test -f deploy/public_html/index.html
          test -f deploy/public_html/manifest.webmanifest
          test -f deploy/public_html/sw.js
          test -f deploy/public_html/icons/app-icon.svg
          test -f deploy/public_html/api/catalog.php
          test -f deploy/public_html/api/events.php
          test -f deploy/public_html/api/reactions.php
          test -f deploy/public_html/api/saved.php
          test -f deploy/public_html/api/me.php
          test -f deploy/public_html/api/work-details.php
          test -f deploy/public_html/api/debug.php
          test ! -f deploy/public_html/api/favorites.php
          test ! -f deploy/public_html/api/recommend.php
          test -f deploy/app/src/UserLibraryService.php
          test -f deploy/app/schema.sql
          test -f deploy/app/cron/setup-db.php
          test -f deploy/app/cron/fanza-sync.php
