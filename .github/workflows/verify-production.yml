name: 本番公開を検証

on:
  workflow_run:
    workflows: ["シンレンタルサーバーへデプロイ"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-production
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://wp983575.wpx.jp
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: 公開バージョン・PWA・セキュリティヘッダーを確認
        shell: bash
        run: |
          set -euo pipefail
          CURL=(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30)
          VERSION="$("${CURL[@]}" -H 'Cache-Control: no-cache' "${BASE_URL}/version.json?sha=${EXPECTED_SHA}")"
          printf '%s' "$VERSION" | grep -F "\"commit\":\"${EXPECTED_SHA}\"" >/dev/null

          MANIFEST="$("${CURL[@]}" "${BASE_URL}/manifest.webmanifest")"
          printf '%s' "$MANIFEST" | grep -F '"display": "standalone"' >/dev/null

          "${CURL[@]}" -D /tmp/headers -o /dev/null "${BASE_URL}/"
          grep -i '^content-security-policy:' /tmp/headers >/dev/null
          grep -i '^strict-transport-security:' /tmp/headers >/dev/null
          grep -i '^x-frame-options: DENY' /tmp/headers >/dev/null

      - name: DB・FANZA設定・固定フィードを確認
        shell: bash
        run: |
          set -euo pipefail
          CURL=(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30)
          HEALTH="$("${CURL[@]}" "${BASE_URL}/api/health?verify=${EXPECTED_SHA}")"
          printf '%s' "$HEALTH" | grep -F '"connected":true' >/dev/null
          printf '%s' "$HEALTH" | grep -F '"catalogReady":true' >/dev/null
          printf '%s' "$HEALTH" | grep -F '"configured":true' >/dev/null

          "${CURL[@]}" -c /tmp/cookies -b /tmp/cookies "${BASE_URL}/api/catalog?limit=3" > /tmp/catalog1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const first = JSON.parse(fs.readFileSync('/tmp/catalog1.json', 'utf8'));
          if (!first.feedId || typeof first.feedId !== 'string') throw new Error('feedId missing');
          if (!Array.isArray(first.items) || first.items.length === 0) throw new Error('catalog items missing');
          if (first.hasMore && typeof first.nextCursor !== 'number') throw new Error('nextCursor missing');
          fs.writeFileSync('/tmp/feed-id', first.feedId);
          fs.writeFileSync('/tmp/cursor', String(first.nextCursor ?? 0));
          NODE

          FEED_ID="$(cat /tmp/feed-id)"
          CURSOR="$(cat /tmp/cursor)"
          "${CURL[@]}" -c /tmp/cookies -b /tmp/cookies "${BASE_URL}/api/catalog?limit=3&feed_id=${FEED_ID}&cursor=${CURSOR}" > /tmp/catalog2.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a = JSON.parse(fs.readFileSync('/tmp/catalog1.json', 'utf8'));
          const b = JSON.parse(fs.readFileSync('/tmp/catalog2.json', 'utf8'));
          if (b.feedId !== a.feedId) throw new Error('feed session changed');
          const seen = new Set(a.items.map((item) => item.cid));
          if (b.items.some((item) => seen.has(item.cid))) throw new Error('catalog page duplicated CID');
          NODE

      - name: 保存済み・マイページ・API公開境界を確認
        shell: bash
        run: |
          set -euo pipefail
          CURL=(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30)
          "${CURL[@]}" -c /tmp/user-cookies -b /tmp/user-cookies "${BASE_URL}/api/saved?limit=2" | grep -F '"ok":true' >/dev/null
          "${CURL[@]}" -c /tmp/user-cookies -b /tmp/user-cookies "${BASE_URL}/api/me" | grep -F '"ok":true' >/dev/null

          for path in /saved /mypage; do
            "${CURL[@]}" "${BASE_URL}${path}" | grep -F '<div id="root"></div>' >/dev/null
          done

          DEBUG_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "${BASE_URL}/api/debug")"
          DIAG_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "${BASE_URL}/api/diagnostics")"
          EVENTS_GET_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "${BASE_URL}/api/events")"
          test "$DEBUG_STATUS" = '404'
          test "$DIAG_STATUS" = '404'
          test "$EVENTS_GET_STATUS" = '405'
          echo "本番公開検証OK: ${EXPECTED_SHA}"
