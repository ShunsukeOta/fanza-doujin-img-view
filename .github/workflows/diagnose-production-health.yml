name: 本番health診断

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: SSHを設定
        env:
          SHIN_SSH_PRIVATE_KEY: ${{ secrets.SHIN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SHIN_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SHIN_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_shin"
          chmod 600 "$HOME/.ssh/id_shin"
          ssh-keyscan -T 10 -p 10022 -H wp983575.wpx.jp > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: 本番healthをCLI診断
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_shin" -p 10022 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            wp983575@wp983575.wpx.jp "bash -s" <<'REMOTE'
          set -u
          BASE="$HOME/wp983575.wpx.jp"
          echo '--- php health.php ---'
          /usr/bin/php8.3 -d display_errors=1 "$BASE/public_html/api/health.php" 2>&1 || true
          echo
          echo '--- bootstrap / DB checks ---'
          /usr/bin/php8.3 -d display_errors=1 -r '
            require getenv("HOME") . "/wp983575.wpx.jp/app/bootstrap.php";
            echo "bootstrap=ok\n";
            echo "db=" . ($database->connection() ? "connected" : "disconnected") . "\n";
            echo "catalog=" . ($database->hasUsableCatalog() ? "ready" : "not-ready") . "\n";
            echo "fanza=" . ($fanza->configured() ? "configured" : "not-configured") . "\n";
          ' 2>&1 || true
          REMOTE

      - name: 本番スモーク対象を個別診断
        run: |
          set -euo pipefail
          BASE='https://wp983575.wpx.jp'
          probe() {
            local label="$1"
            local url="$2"
            local cookie_args="${3:-}"
            local body="/tmp/probe-${label}.body"
            local code
            if [ -n "$cookie_args" ]; then
              code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 $cookie_args -o "$body" --write-out '%{http_code}' "$url" || true)"
            else
              code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 -o "$body" --write-out '%{http_code}' "$url" || true)"
            fi
            echo "${label}=${code}"
            if [ "$code" -ge 400 ] 2>/dev/null; then
              echo "--- ${label} error body ---"
              head -c 1200 "$body" || true
              echo
            fi
          }

          probe version "${BASE}/version.json?diag=1"
          probe manifest "${BASE}/manifest.webmanifest"
          probe root "${BASE}/"
          probe health "${BASE}/api/health"

          CATALOG1=/tmp/catalog1.json
          CAT1_CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 30 -c /tmp/feed-cookies -b /tmp/feed-cookies -o "$CATALOG1" --write-out '%{http_code}' "${BASE}/api/catalog?limit=3" || true)"
          echo "catalog1=${CAT1_CODE}"
          if [ "$CAT1_CODE" != '200' ]; then head -c 1200 "$CATALOG1" || true; echo; fi

          if [ "$CAT1_CODE" = '200' ]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const first = JSON.parse(fs.readFileSync('/tmp/catalog1.json', 'utf8'));
          fs.writeFileSync('/tmp/feed-id', String(first.feedId ?? ''));
          fs.writeFileSync('/tmp/cursor', String(first.nextCursor ?? 0));
          fs.writeFileSync('/tmp/work-cid', String(first.items?.[0]?.cid ?? ''));
          NODE
            FEED_ID="$(cat /tmp/feed-id)"
            CURSOR="$(cat /tmp/cursor)"
            WORK_CID="$(cat /tmp/work-cid)"
            probe catalog2 "${BASE}/api/catalog?limit=3&feed_id=${FEED_ID}&cursor=${CURSOR}" "-c /tmp/feed-cookies -b /tmp/feed-cookies"
            probe search "${BASE}/api/search?limit=3&sort=popular" "-c /tmp/user-cookies -b /tmp/user-cookies"
            if [ -n "$WORK_CID" ]; then
              probe work "${BASE}/work/${WORK_CID}"
              REDIRECT_CODE="$(curl --silent --show-error --head --output /tmp/redirect-body --write-out '%{http_code}' "${BASE}/?cid=${WORK_CID}" || true)"
              REDIRECT_URL="$(curl --silent --head --output /dev/null --write-out '%{redirect_url}' "${BASE}/?cid=${WORK_CID}" || true)"
              echo "redirect=${REDIRECT_CODE} ${REDIRECT_URL}"
            fi
            probe saved "${BASE}/api/saved?limit=2" "-c /tmp/user-cookies -b /tmp/user-cookies"
            probe me "${BASE}/api/me" "-c /tmp/user-cookies -b /tmp/user-cookies"
          fi

          for path in saved search mypage history; do
            probe "page-${path}" "${BASE}/${path}"
          done

          for endpoint in debug diagnostics events; do
            code="$(curl --silent --show-error --output "/tmp/${endpoint}-body" --write-out '%{http_code}' "${BASE}/api/${endpoint}" || true)"
            echo "boundary-${endpoint}=${code}"
          done
