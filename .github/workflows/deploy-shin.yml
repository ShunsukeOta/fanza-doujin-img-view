name: シンレンタルサーバーへデプロイ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shin-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PHPを準備
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql
          coverage: none

      - name: 依存関係をインストール
        run: npm install --no-audit --no-fund

      - name: 型チェック
        run: npm run typecheck

      - name: PHP構文チェック
        run: npm run check:php

      - name: シンレンタルサーバー用成果物を作成
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build:shin

      - name: SSHを設定
        shell: bash
        env:
          SHIN_SSH_PRIVATE_KEY: ${{ secrets.SHIN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SHIN_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_shin"
          chmod 600 "$HOME/.ssh/id_shin"
          : > "$HOME/.ssh/known_hosts"

          for attempt in 1 2 3 4 5; do
            tmp_hosts="$(mktemp)"
            if timeout 20s ssh-keyscan -T 10 -p 10022 -H wp983575.wpx.jp > "$tmp_hosts" 2>/dev/null && [ -s "$tmp_hosts" ]; then
              cat "$tmp_hosts" >> "$HOME/.ssh/known_hosts"
              rm -f "$tmp_hosts"
              break
            fi
            rm -f "$tmp_hosts"
            if [ "$attempt" -eq 5 ]; then
              echo "SSHホスト鍵を5回試行しても取得できませんでした。" >&2
              exit 1
            fi
            echo "SSHホスト鍵取得に失敗。${attempt}/5 回目、再試行します。"
            sleep $((attempt * 3))
          done

          chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

      - name: SSH接続を確認
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if ssh -i "$HOME/.ssh/id_shin" -p 10022 \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
              wp983575@wp983575.wpx.jp \
              'mkdir -p "$HOME/wp983575.wpx.jp/public_html" "$HOME/wp983575.wpx.jp/app" && echo "SSH接続OK"'; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "SSH接続に4回失敗しました。" >&2
              exit 1
            fi
            echo "SSH接続に失敗。${attempt}/4 回目、再試行します。"
            sleep $((attempt * 4))
          done

      - name: public_htmlへ同期
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if rsync -az --delete \
              -e "ssh -i $HOME/.ssh/id_shin -p 10022 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
              deploy/public_html/ \
              wp983575@wp983575.wpx.jp:wp983575.wpx.jp/public_html/; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "public_htmlの同期に3回失敗しました。" >&2
              exit 1
            fi
            echo "public_html同期に失敗。${attempt}/3 回目、再試行します。"
            sleep $((attempt * 5))
          done

      - name: 非公開アプリ領域へ同期
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if rsync -az --delete \
              --exclude='config.local.php' \
              -e "ssh -i $HOME/.ssh/id_shin -p 10022 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
              deploy/app/ \
              wp983575@wp983575.wpx.jp:wp983575.wpx.jp/app/; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "非公開アプリ領域の同期に3回失敗しました。" >&2
              exit 1
            fi
            echo "非公開アプリ同期に失敗。${attempt}/3 回目、再試行します。"
            sleep $((attempt * 5))
          done

      - name: サーバー内の配置を確認
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ssh -i "$HOME/.ssh/id_shin" -p 10022 \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
              wp983575@wp983575.wpx.jp \
              "cd wp983575.wpx.jp && grep -F '\"commit\":\"${GITHUB_SHA}\"' public_html/version.json >/dev/null && test -f public_html/api/health.php && test -f app/cron/fanza-sync.php"; then
              echo "サーバー内配置確認OK: ${GITHUB_SHA}"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "サーバー内配置確認に3回失敗しました。" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: HTTPS公開を確認
        shell: bash
        run: |
          set -euo pipefail
          CURL_ARGS=(--fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache')
          VERSION="$(curl "${CURL_ARGS[@]}" "https://wp983575.wpx.jp/version.json?sha=${GITHUB_SHA}")"
          printf '%s' "$VERSION" | grep -F "\"commit\":\"${GITHUB_SHA}\"" >/dev/null
          HEALTH="$(curl "${CURL_ARGS[@]}" "https://wp983575.wpx.jp/api/health?sha=${GITHUB_SHA}")"
          printf '%s' "$HEALTH" | grep -F '"runtime":"php"' >/dev/null
          echo "HTTPS公開確認OK: ${GITHUB_SHA}"
