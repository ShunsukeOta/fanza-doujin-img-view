name: シンレンタルサーバーへデプロイ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shin-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PHPを準備
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql
          coverage: none

      - name: 依存関係をインストール
        run: npm install --no-audit --no-fund

      - name: 型チェック
        run: npm run typecheck

      - name: PHP構文チェック
        run: npm run check:php

      - name: シンレンタルサーバー用成果物を作成
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build:shin

      - name: SSHを設定
        shell: bash
        env:
          SHIN_SSH_PRIVATE_KEY: ${{ secrets.SHIN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SHIN_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_shin"
          chmod 600 "$HOME/.ssh/id_shin"
          ssh-keyscan -p 10022 -H wp983575.wpx.jp >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: SSH接続を確認
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_shin" -p 10022 -o BatchMode=yes -o IdentitiesOnly=yes \
            wp983575@wp983575.wpx.jp \
            'mkdir -p "$HOME/wp983575.wpx.jp/public_html" "$HOME/wp983575.wpx.jp/app" && echo "SSH接続OK"'

      - name: public_htmlへ同期
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_shin -p 10022 -o BatchMode=yes -o IdentitiesOnly=yes" \
            deploy/public_html/ \
            wp983575@wp983575.wpx.jp:wp983575.wpx.jp/public_html/

      - name: 非公開アプリ領域へ同期
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='config.local.php' \
            -e "ssh -i $HOME/.ssh/id_shin -p 10022 -o BatchMode=yes -o IdentitiesOnly=yes" \
            deploy/app/ \
            wp983575@wp983575.wpx.jp:wp983575.wpx.jp/app/

      - name: デプロイ内容を確認
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_shin" -p 10022 -o BatchMode=yes -o IdentitiesOnly=yes \
            wp983575@wp983575.wpx.jp \
            "grep -F '\"commit\":\"${GITHUB_SHA}\"' '$HOME/wp983575.wpx.jp/public_html/version.json' >/dev/null && test -f '$HOME/wp983575.wpx.jp/public_html/api/health.php' && test -f '$HOME/wp983575.wpx.jp/app/cron/fanza-sync.php'"
          echo "デプロイ確認OK: ${GITHUB_SHA}"
