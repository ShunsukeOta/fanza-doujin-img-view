name: シンレンタルサーバーへデプロイ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shin-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 依存関係をインストール
        run: npm install --no-audit --no-fund

      - name: 型チェック
        run: npm run typecheck --if-present

      - name: シンレンタルサーバー用成果物を作成
        run: npm run build:shin --if-present

      - name: SSHを設定
        shell: bash
        env:
          SHIN_SSH_PRIVATE_KEY: ${{ secrets.SHIN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SHIN_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_shin"
          chmod 600 "$HOME/.ssh/id_shin"
          ssh-keyscan -p 10022 -H wp983575.wpx.jp >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: SSH接続を確認
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/id_shin" \
            -p 10022 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            wp983575@wp983575.wpx.jp \
            'test -d "$HOME/wp983575.wpx.jp/public_html" && echo "SSH接続OK: $HOME/wp983575.wpx.jp/public_html"'

      - name: デプロイ成果物を確認
        id: artifact
        shell: bash
        run: |
          if [ -d "deploy" ] && [ -n "$(find deploy -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "deploy/ を公開します。"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "deploy/ がまだ生成されていないため、今回はファイル転送をスキップします。"
            echo "React/Vite + PHP への移行時に build:shin で deploy/ を生成すると自動デプロイが有効になります。"
          fi

      - name: rsyncでpublic_htmlへ同期
        if: steps.artifact.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='.env' \
            -e "ssh -i $HOME/.ssh/id_shin -p 10022 -o BatchMode=yes -o IdentitiesOnly=yes" \
            deploy/ \
            wp983575@wp983575.wpx.jp:wp983575.wpx.jp/public_html/
