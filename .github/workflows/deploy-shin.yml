name: シンレンタルサーバーへデプロイ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: shin-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://wp983575.wpx.jp
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: push時は成功済みPR CIを必須にする
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          PRS="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          PR_NUMBER="$(printf '%s' "$PRS" | jq -r '[.[] | select(.merged_at != null)] | first | .number // empty')"
          PR_HEAD="$(printf '%s' "$PRS" | jq -r '[.[] | select(.merged_at != null)] | first | .head.sha // empty')"
          if [ -z "$PR_NUMBER" ] || [ -z "$PR_HEAD" ]; then
            echo "mainへの直接pushは本番デプロイしません。成功済みPR経由が必要です。" >&2
            exit 1
          fi
          RUNS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=pull_request&head_sha=${PR_HEAD}&status=completed&per_page=20")"
          if ! printf '%s' "$RUNS" | jq -e '.workflow_runs | any(.conclusion == "success")' >/dev/null; then
            echo "PR #${PR_NUMBER} head=${PR_HEAD} の成功済みCIが見つかりません。" >&2
            exit 1
          fi
          echo "PR #${PR_NUMBER} の成功済みCIを確認しました。"

      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Node.jsを準備
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 本番Secretsを確認
        shell: bash
        env:
          SHIN_SSH_PRIVATE_KEY: ${{ secrets.SHIN_SSH_PRIVATE_KEY }}
          SHIN_DB_NAME: ${{ secrets.SHIN_DB_NAME }}
          SHIN_DB_USER: ${{ secrets.SHIN_DB_USER }}
          SHIN_DB_PASSWORD: ${{ secrets.SHIN_DB_PASSWORD }}
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
        run: |
          set -euo pipefail
          for name in SHIN_SSH_PRIVATE_KEY SHIN_DB_NAME SHIN_DB_USER SHIN_DB_PASSWORD DMM_API_ID DMM_AFFILIATE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "必須Secret ${name} が未設定です。" >&2
              exit 1
            fi
          done

      - name: 本番成果物を作成
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f package-lock.json
          npm ci --no-audit --no-fund
          npm run build:shin

      - name: SSHを設定
        shell: bash
        env:
          SHIN_SSH_PRIVATE_KEY: ${{ secrets.SHIN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SHIN_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_shin"
          chmod 600 "$HOME/.ssh/id_shin"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            tmp_hosts="$(mktemp)"
            if timeout 20s ssh-keyscan -T 10 -p 10022 -H wp983575.wpx.jp > "$tmp_hosts" 2>/dev/null && [ -s "$tmp_hosts" ]; then
              cat "$tmp_hosts" >> "$HOME/.ssh/known_hosts"
              rm -f "$tmp_hosts"
              break
            fi
            rm -f "$tmp_hosts"
            if [ "$attempt" -eq 5 ]; then
              echo "SSHホスト鍵を取得できませんでした。" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: SSH接続とリリース領域を準備
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_shin" -p 10022 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            wp983575@wp983575.wpx.jp \
            "set -eu; test -x /usr/bin/php8.3; BASE=\"\$HOME/wp983575.wpx.jp\"; RELEASE=\"\$BASE/.releases/${GITHUB_SHA}\"; rm -rf \"\$RELEASE\"; mkdir -p \"\$RELEASE/public_html\" \"\$RELEASE/app\" \"\$BASE/public_html\" \"\$BASE/app\"; /usr/bin/php8.3 -v | head -n 1"

      - name: リリース領域へ成果物を転送
        shell: bash
        run: |
          set -euo pipefail
          SSH_CMD="ssh -i $HOME/.ssh/id_shin -p 10022 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15"
          REMOTE="wp983575@wp983575.wpx.jp:wp983575.wpx.jp/.releases/${GITHUB_SHA}"
          rsync -az --delete -e "$SSH_CMD" deploy/public_html/ "${REMOTE}/public_html/"
          rsync -az --delete -e "$SSH_CMD" deploy/app/ "${REMOTE}/app/"

      - name: リリース用設定を生成して転送
        shell: bash
        env:
          SHIN_DB_NAME: ${{ secrets.SHIN_DB_NAME }}
          SHIN_DB_USER: ${{ secrets.SHIN_DB_USER }}
          SHIN_DB_PASSWORD: ${{ secrets.SHIN_DB_PASSWORD }}
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          SHIN_ADMIN_TOKEN: ${{ secrets.SHIN_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const escapePhp = (value = '') => `'${String(value).replaceAll('\\', '\\\\').replaceAll("'", "\\'")}'`;
          const config = `<?php\ndeclare(strict_types=1);\nreturn [\n  'dmm' => [\n    'api_id' => ${escapePhp(process.env.DMM_API_ID)},\n    'affiliate_id' => ${escapePhp(process.env.DMM_AFFILIATE_ID)},\n  ],\n  'db' => [\n    'host' => 'localhost',\n    'port' => 3306,\n    'name' => ${escapePhp(process.env.SHIN_DB_NAME)},\n    'user' => ${escapePhp(process.env.SHIN_DB_USER)},\n    'password' => ${escapePhp(process.env.SHIN_DB_PASSWORD)},\n    'charset' => 'utf8mb4',\n  ],\n  'app' => [\n    'timezone' => 'Asia/Tokyo',\n    'public_origin' => 'https://wp983575.wpx.jp',\n    'event_retention_days' => 60,\n    'profile_retention_days' => 180,\n    'sync_pages' => 5,\n    'admin_token' => ${escapePhp(process.env.SHIN_ADMIN_TOKEN || '')},\n  ],\n];\n`;
          fs.writeFileSync('/tmp/config.local.php', config, { mode: 0o600 });
          NODE
          rsync -az \
            -e "ssh -i $HOME/.ssh/id_shin -p 10022 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            /tmp/config.local.php \
            "wp983575@wp983575.wpx.jp:wp983575.wpx.jp/.releases/${GITHUB_SHA}/app/config.local.php"
          rm -f /tmp/config.local.php

      - name: 本番切替前にDB移行と素人動画同期を完了
        shell: bash
        run: |
          set -euo pipefail
          SETUP_OUTPUT="$(ssh -i "$HOME/.ssh/id_shin" -p 10022 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            wp983575@wp983575.wpx.jp "set -eu; APP=\"\$HOME/wp983575.wpx.jp/.releases/${GITHUB_SHA}/app\"; chmod 600 \"\$APP/config.local.php\"; /usr/bin/php8.3 \"\$APP/cron/setup-db.php\"")"
          printf '%s\n' "$SETUP_OUTPUT"
          WORKS="$(printf '%s\n' "$SETUP_OUTPUT" | sed -n 's/.*works=\([0-9][0-9]*\).*/\1/p' | tail -n 1)"
          test -n "$WORKS"
          if [ "$WORKS" -eq 0 ]; then
            echo "初回作品DBを投入します。"
            ssh -i "$HOME/.ssh/id_shin" -p 10022 \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
              wp983575@wp983575.wpx.jp \
              "set -eu; APP=\"\$HOME/wp983575.wpx.jp/.releases/${GITHUB_SHA}/app\"; /usr/bin/php8.3 \"\$APP/cron/fanza-sync.php\" --pages=20 --sort=date"
          else
            echo "既存作品DB ${WORKS} 件を維持します。"
            echo "素人動画フロアの最新作品を本番切替前に同期します。"
            ssh -i "$HOME/.ssh/id_shin" -p 10022 \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
              wp983575@wp983575.wpx.jp \
              "set -eu; APP=\"\$HOME/wp983575.wpx.jp/.releases/${GITHUB_SHA}/app\"; /usr/bin/php8.3 \"\$APP/cron/fanza-sync.php\" --pages=5 --sort=date --floor=amateur"
          fi

      - name: 移行成功後に本番へ切り替え
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_shin" -p 10022 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            wp983575@wp983575.wpx.jp "bash -s" <<REMOTE
          set -eu
          BASE="\$HOME/wp983575.wpx.jp"
          RELEASE="\$BASE/.releases/${GITHUB_SHA}"
          test -f "\$RELEASE/app/config.local.php"
          test -f "\$RELEASE/public_html/version.json"
          rsync -a --delete "\$RELEASE/app/" "\$BASE/app/"
          rsync -a --delete --exclude='.well-known/' "\$RELEASE/public_html/" "\$BASE/public_html/"
          chmod 600 "\$BASE/app/config.local.php"
          grep -F '"commit":"${GITHUB_SHA}"' "\$BASE/public_html/version.json" >/dev/null
          test ! -e "\$BASE/app/tests"
          rm -rf "\$RELEASE"
          REMOTE

      - name: 本番HTTP・PWA・固定feed・検索・共有URL・動画フロア・公開境界を確認
        shell: bash
        run: |
          set -euo pipefail
          CURL=(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30)

          VERSION="$("${CURL[@]}" -H 'Cache-Control: no-cache' "${BASE_URL}/version.json?sha=${GITHUB_SHA}")"
          printf '%s' "$VERSION" | grep -F "\"commit\":\"${GITHUB_SHA}\"" >/dev/null

          MANIFEST="$("${CURL[@]}" "${BASE_URL}/manifest.webmanifest")"
          printf '%s' "$MANIFEST" | grep -F '"display": "standalone"' >/dev/null

          "${CURL[@]}" -D /tmp/headers -o /dev/null "${BASE_URL}/"
          grep -i '^content-security-policy:' /tmp/headers >/dev/null
          grep -i '^strict-transport-security:' /tmp/headers >/dev/null
          grep -i '^x-frame-options: DENY' /tmp/headers >/dev/null

          HEALTH="$("${CURL[@]}" "${BASE_URL}/api/health?sha=${GITHUB_SHA}")"
          printf '%s' "$HEALTH" | grep -F '"connected":true' >/dev/null
          printf '%s' "$HEALTH" | grep -F '"catalogReady":true' >/dev/null
          printf '%s' "$HEALTH" | grep -F '"configured":true' >/dev/null

          "${CURL[@]}" -c /tmp/feed-cookies -b /tmp/feed-cookies "${BASE_URL}/api/catalog?limit=3" > /tmp/catalog1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const first = JSON.parse(fs.readFileSync('/tmp/catalog1.json', 'utf8'));
          if (!first.feedId || !Array.isArray(first.items) || first.items.length === 0) throw new Error('catalog first page invalid');
          if (first.hasMore && typeof first.nextCursor !== 'number') throw new Error('nextCursor missing');
          fs.writeFileSync('/tmp/feed-id', first.feedId);
          fs.writeFileSync('/tmp/cursor', String(first.nextCursor ?? 0));
          fs.writeFileSync('/tmp/work-cid', String(first.items[0].cid ?? ''));
          NODE

          FEED_ID="$(cat /tmp/feed-id)"
          CURSOR="$(cat /tmp/cursor)"
          WORK_CID="$(cat /tmp/work-cid)"
          test -n "$WORK_CID"
          "${CURL[@]}" -c /tmp/feed-cookies -b /tmp/feed-cookies "${BASE_URL}/api/catalog?limit=3&feed_id=${FEED_ID}&cursor=${CURSOR}" > /tmp/catalog2.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const first = JSON.parse(fs.readFileSync('/tmp/catalog1.json', 'utf8'));
          const second = JSON.parse(fs.readFileSync('/tmp/catalog2.json', 'utf8'));
          if (second.feedId !== first.feedId) throw new Error('feed session changed');
          const seen = new Set(first.items.map((item) => item.cid));
          if (second.items.some((item) => seen.has(item.cid))) throw new Error('duplicated CID across pages');
          NODE

          SEARCH="$("${CURL[@]}" -c /tmp/user-cookies -b /tmp/user-cookies "${BASE_URL}/api/search?limit=3&sort=popular")"
          printf '%s' "$SEARCH" | grep -F '"ok":true' >/dev/null
          printf '%s' "$SEARCH" | grep -F '"items":[' >/dev/null

          "${CURL[@]}" -c /tmp/video-cookies -b /tmp/video-cookies "${BASE_URL}/api/catalog?floor=amateur&limit=1" > /tmp/amateur-catalog.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('/tmp/amateur-catalog.json', 'utf8'));
          if (!Array.isArray(catalog.items) || catalog.items.length === 0) throw new Error('amateur catalog is empty');
          const item = catalog.items[0];
          if (item.floorKey !== 'amateur' || item.mediaType !== 'video' || !item.sampleMovieUrl) throw new Error('amateur catalog item invalid');
          NODE
          AMATEUR_SEARCH="$("${CURL[@]}" -c /tmp/video-cookies -b /tmp/video-cookies "${BASE_URL}/api/search?floor=amateur&limit=1&sort=popular")"
          printf '%s' "$AMATEUR_SEARCH" | grep -F '"ok":true' >/dev/null
          printf '%s' "$AMATEUR_SEARCH" | grep -F '"floorKey":"amateur"' >/dev/null

          WORK_HTML="$("${CURL[@]}" "${BASE_URL}/work/${WORK_CID}")"
          printf '%s' "$WORK_HTML" | grep -F 'property="og:title"' >/dev/null
          printf '%s' "$WORK_HTML" | grep -F 'property="og:image"' >/dev/null
          printf '%s' "$WORK_HTML" | grep -F "rel=\"canonical\" href=\"${BASE_URL}/work/${WORK_CID}\"" >/dev/null
          printf '%s' "$WORK_HTML" | grep -F '<div id="root"></div>' >/dev/null

          REDIRECT_LOCATION="$(curl --silent --head --output /dev/null --write-out '%{redirect_url}' "${BASE_URL}/?cid=${WORK_CID}")"
          test "$REDIRECT_LOCATION" = "${BASE_URL}/work/${WORK_CID}"

          "${CURL[@]}" -c /tmp/user-cookies -b /tmp/user-cookies "${BASE_URL}/api/saved?limit=2" | grep -F '"ok":true' >/dev/null
          "${CURL[@]}" -c /tmp/user-cookies -b /tmp/user-cookies "${BASE_URL}/api/me" | grep -F '"ok":true' >/dev/null
          for path in /saved /search /mypage /actress /amateur; do
            "${CURL[@]}" "${BASE_URL}${path}" | grep -F '<div id="root"></div>' >/dev/null
          done

          DEBUG_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "${BASE_URL}/api/debug")"
          DIAG_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "${BASE_URL}/api/diagnostics")"
          EVENTS_GET_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "${BASE_URL}/api/events")"
          test "$DEBUG_STATUS" = '404'
          test "$DIAG_STATUS" = '404'
          test "$EVENTS_GET_STATUS" = '405'
          echo "本番検証OK: ${GITHUB_SHA}"
