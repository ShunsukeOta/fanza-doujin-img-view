name: PR診断

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: diagnose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - src/main.tsx
          - components/SwipePreviewApp.tsx
          - components/WorkCard.tsx
          - components/MyPage.tsx
          - components/SearchPage.tsx
          - components/SavedPage.tsx
          - components/HistoryPage.tsx
          - src/saveState.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 対象単位でTypeScriptを検証
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node -e 'const fs=require("fs"); fs.writeFileSync("tsconfig.diagnose.json", JSON.stringify({extends:"./tsconfig.json",include:[process.env.TARGET]},null,2))'
          npx tsc -p tsconfig.diagnose.json --noEmit

  debt:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 負債本体
            command: node scripts/check-debt.mjs
          - name: PWAレイアウト
            command: node scripts/check-pwa-layout.mjs
          - name: 収益導線
            command: node scripts/check-commerce.mjs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: ${{ matrix.command }}
