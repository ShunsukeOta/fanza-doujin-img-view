name: PR診断

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: diagnose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact:
    name: 診断 / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - client-my
          - client-legal
          - client-search
          - client-saved
          - client-nav
          - client-save-state
          - client-types
          - server-schema
          - server-events
          - server-library
          - server-setup
          - server-search
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: ファイル単位で負債を検証
        env:
          DEBT_CHECK: ${{ matrix.check }}
        run: node scripts/diagnose-exact.mjs
