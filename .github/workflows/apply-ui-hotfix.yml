name: Apply UI hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ui-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update feed chips and CTA
        shell: python
        run: |
          from pathlib import Path
          import re

          component_path = Path("components/SwipePreviewApp.tsx")
          component = component_path.read_text(encoding="utf-8")

          clamp_block = '''function clamp(value: number, min: number, max: number) {
            return Math.max(min, Math.min(max, value));
          }
          '''
          format_block = '''function clamp(value: number, min: number, max: number) {
            return Math.max(min, Math.min(max, value));
          }

          function formatPrice(price: string) {
            const digits = price.replace(/[^0-9]/g, "");
            if (!digits) return price;
            const value = Number.parseInt(digits, 10);
            return Number.isFinite(value) ? `¥${value.toLocaleString("ja-JP")}` : price;
          }
          '''

          if "function formatPrice(price: string)" not in component:
            if clamp_block not in component:
              raise SystemExit("clamp block not found")
            component = component.replace(clamp_block, format_block, 1)

          old_stats = '''        <div className="item-stats">
                    <span className="stat-chip">
                      ★ <strong>{item.rating.toFixed(1)}</strong>
                    </span>
                    <span className="stat-chip">
                      レビュー <strong>{item.reviews}</strong>
                    </span>
                    <span className="stat-chip">
                      サンプル <strong>{item.images.length}</strong>P
                    </span>
                    {item.price ? (
                      <span className="stat-chip">
                        <strong>{item.price}</strong>
                      </span>
                    ) : null}
                  </div>'''
          new_stats = '''        <div className="item-stats">
                    <span className="stat-chip">
                      ★<strong>{item.rating.toFixed(1)}</strong> <span>({item.reviews}件)</span>
                    </span>
                    {item.price ? (
                      <span className="stat-chip">
                        <strong>{formatPrice(item.price)}</strong>
                      </span>
                    ) : null}
                  </div>'''

          if old_stats not in component:
            raise SystemExit("item-stats block not found")
          component = component.replace(old_stats, new_stats, 1)
          component_path.write_text(component, encoding="utf-8")

          css_path = Path("app/globals.css")
          css = css_path.read_text(encoding="utf-8")
          pattern = re.compile(r'(\.open-link\s*\{.*?)(background:\s*)#fff;(\s*color:\s*)#090909;(.*?box-shadow:\s*)0 7px 20px #00000047;(.*?\})', re.S)
          replacement = r'\1\2#ff2d55;\3#fff;\4 0 8px 24px rgba(255, 45, 85, 0.34);\5'
          css, count = pattern.subn(replacement, css, count=1)
          if count != 1:
            raise SystemExit("open-link style block not found")
          css_path.write_text(css, encoding="utf-8")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SwipePreviewApp.tsx app/globals.css
          git commit -m "Simplify feed stats and highlight FANZA CTA"
          git push origin main

# one-shot trigger
